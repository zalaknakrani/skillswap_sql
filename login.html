<!DOCTYPE html>
<html>
    <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="style.css">
    </head>
<body>

<div class="login-box" role="main" aria-labelledby="login-heading">
    <div class="app-header" style="justify-content: space-between; align-items: center; gap: 0.75rem;">
        <div>
            <h1 id="login-heading" style="font-size:46px; margin:0;">Welcome to Skill-Swap</h1>
            <p class="eyebrow" style="margin: 0.35rem 0 0;">Create an account or login to share and learn skills.</p>
        </div>
        <button id="themeToggleBtn" class="theme-toggle" type="button" onclick="toggleTheme()" aria-pressed="false">Toggle Theme</button>
    </div>
    <div style="height:12px"></div>
    <p style="display:block; color:#d1d5db; font-size:17px; margin:10px 0;">create an account or login account to share and learn skills.</p><br><br>

    <form id="authForm" onsubmit="return false;" style="margin-top:18px; width:100%;">
        <label for="email" style="display:block; text-align:left; margin:8px 0;">Email address :</label>
        <input id="email" name="email" type="email" placeholder="name123@gmail.com" required><br>

        <label for="password" style="display:block; text-align:left; margin:8px 0;">Password :</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required><br>

        <p class="helper-text" style="display:block; color:#d1d5db; font-size:17px; margin:10px 0;">We'll never share your email. Use a strong password.</p>
        <br>
        <div>
            <button id="registerBtn" type="button">Register</button><br><br>
            <button id="loginBtn" type="button">Login</button>
            <button type="submit" style="display:none;"></button>
        </div>
        <br>
        <p style="display:block; color:#d1d5db; font-size:17px; margin:10px 0;">
            <a href="#" onclick="toggleForgotPassword(true); return false;" style="color:#a78bfa; text-decoration:none;">Forgot password?</a>
        </p>

        <div id="forgotPasswordSection" style="display:none; margin-top:20px; padding:15px; border:1px solid #7c3aed; border-radius:12px; background:rgba(124,58,237,0.08);">
            <h3 style="margin-top:0; color:#fff;">Reset Password</h3>
            <label for="forgotEmail" style="display:block; text-align:left; margin:8px 0;">Email address :</label>
            <input id="forgotEmail" type="email" placeholder="name123@gmail.com" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid #7c3aed; border-radius:8px; background:#111827; color:#fff;">
            <label for="forgotNewPassword" style="display:block; text-align:left; margin:8px 0;">New Password :</label>
            <input id="forgotNewPassword" type="password" placeholder="Enter new password" style="width:100%; margin-bottom:10px; padding:10px; border:1px solid #7c3aed; border-radius:8px; background:#111827; color:#fff;">
            <label for="forgotConfirmPassword" style="display:block; text-align:left; margin:8px 0;">Confirm Password :</label>
            <input id="forgotConfirmPassword" type="password" placeholder="Confirm new password" style="width:100%; margin-bottom:12px; padding:10px; border:1px solid #7c3aed; border-radius:8px; background:#111827; color:#fff;">
            <button type="button" onclick="resetPassword()" style="margin-right:10px;">Reset Password</button>
            <button type="button" onclick="toggleForgotPassword(false)" style="background:#374151;">Cancel</button>
        </div>
    </form>
</div>

<script src="app.js"></script>
<script src="theme.js"></script>

</body>
</html>
